<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت موسیقی | RushFinder</title><style>@font-face{font-family:Yekan;src:url('/fonts/Yekan.woff2')}*{box-sizing:border-box}body{font-family:Yekan,Tahoma,sans-serif;background:linear-gradient(135deg,#eff8ff,#fff);color:#172b4b;margin:0;min-height:100vh}.wrap{max-width:780px;margin:50px auto;padding:20px}.panel{background:white;border:1px solid #dce9f6;border-radius:20px;padding:26px;box-shadow:0 12px 32px #15355a12}h1{font-size:23px;margin:0 0 10px}p{color:#5c6d83}label{display:block;margin:14px 0 5px}input,select{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:10px;font:inherit}button{background:#147ce5;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer;margin-top:16px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e9f1fb;color:#174d80}#message{white-space:pre-wrap;margin-top:14px;color:#31577a}.hidden{display:none}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.hint{font-size:13px}progress{width:100%;height:12px;margin-top:16px}a{color:#136cc8}</style></head><body><div class="wrap"><div class="panel"><header><h1>مدیریت آرشیو موسیقی RushFinder</h1><a href="/">بازگشت به سایت</a></header><p>این صفحه برای مدیریت آرشیو است؛ بازدیدکنندگان سایت نیازی به ورود ندارند.</p><section id="login"><label>ایمیل مدیر</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="signin">ورود مدیر</button></section><section id="dashboard" class="hidden"><p id="who"></p><label>فایل صوتی (MP3، WAV، OGG، M4A، FLAC)</label><input id="audio" type="file" accept=".mp3,.wav,.ogg,.oga,.m4a,.flac,audio/*"><label>عنوان فارسی فایل</label><input id="title" placeholder="مثلاً موسیقی خبری فوری ۰۱"><label>دسته‌بندی</label><select id="category"><option value="خبری">خبری</option><option value="سیاسی">سیاسی</option><option value="ورزشی">ورزشی</option><option value="حماسی">حماسی</option><option value="سینمایی">سینمایی</option><option value="هیجانی">هیجانی</option><option value="مستند">مستند</option><option value="تکنولوژی">تکنولوژی</option><option value="دراماتیک">دراماتیک</option><option value="انرژی">انرژی</option><option value="غمگین">غمگین</option><option value="آرام">آرام</option><option value="کردی">کردی</option><option value="بندری">بندری</option><option value="شمالی">شمالی</option><option value="سایر">سایر</option></select><label>کلمات کلیدی (اختیاری)</label><input id="keywords" placeholder="خبر، فوری، تیتراژ"><p class="hint">عنوان، دسته‌بندی و کلمات کلیدی در نام فایل ذخیره می‌شوند تا جست‌وجوی فعلی سایت بتواند آن‌ها را پیدا کند. فقط فایل‌هایی را منتشر کنید که مجوز بازنشرشان را دارید.</p><button id="upload">آپلود موسیقی</button> <button class="secondary" id="signout">خروج</button><progress id="progress" value="0" max="100" class="hidden"></progress></section><div id="message" role="status" aria-live="polite"></div></div></div><script type="module">
import {Client,Account,Storage,ID,Permission,Role} from 'https://cdn.jsdelivr.net/npm/appwrite@17.0.2/+esm';
const PROJECT='6aca3a1e0018d4b9fbe9', BUCKET='6aca3a52000d75ea5085';
const client=new Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject(PROJECT), account=new Account(client),storage=new Storage(client);
const $=id=>document.getElementById(id),say=t=>$('message').textContent=t;
async function refresh(){try{const u=await account.get();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent='وارد شده: '+u.email;}catch{$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}}
$('signin').onclick=async()=>{const b=$('signin');b.disabled=true;say('در حال ورود...');try{await account.createEmailPasswordSession($('email').value.trim(),$('password').value);$('password').value='';say('ورود موفق');await refresh()}catch(e){say('ورود ناموفق: '+(e.message||e))}finally{b.disabled=false}};
$('signout').onclick=async()=>{try{await account.deleteSession('current');say('خارج شدید')}catch(e){say(e.message)}await refresh()};
function clean(s){return String(s||'').replace(/[\\/<>:"|?*\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().slice(0,90)}
$('upload').onclick=async()=>{const f=$('audio').files[0], title=clean($('title').value),cat=clean($('category').value),keys=clean($('keywords').value);if(!f||!title){say('فایل و عنوان فارسی را انتخاب کنید.');return}const ext=(f.name.match(/\.(mp3|wav|ogg|oga|m4a|flac)$/i)||[])[1];if(!ext){say('فرمت فایل پشتیبانی نمی‌شود.');return}const b=$('upload');b.disabled=true;$('progress').classList.remove('hidden');$('progress').value=0;try{const filename=[cat,title,keys].filter(Boolean).join(' - ')+'.'+ext.toLowerCase();const namedFile=new File([f],filename,{type:f.type||'application/octet-stream'});await storage.createFile(BUCKET,ID.unique(),namedFile,[Permission.read(Role.any())],p=>{$('progress').value=p.progress||0});say('فایل با موفقیت آپلود شد: '+filename+'\nحالا در جست‌وجوی سایت بررسی کنید.');$('audio').value='';$('title').value='';$('keywords').value=''}catch(e){say('آپلود انجام نشد: '+(e.message||e)+'\nدسترسی Create در Storage باید فقط برای حساب مدیر فعال باشد.')}finally{b.disabled=false}};
refresh();
</script></body></html>
