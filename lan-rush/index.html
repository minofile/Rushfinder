<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RushFinder | آرشیو داخلی راش</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f3ff,#f7fbff);color:#172e51;font-family:Tahoma,Arial,sans-serif;min-height:100vh}header{background:#102b55;color:white;padding:22px max(22px,5vw);display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:22px}header small{color:#b8d4f4}main{max-width:1300px;margin:auto;padding:24px} .bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}input,select,button{font:inherit;border:1px solid #cbdcf1;border-radius:12px;padding:13px 16px}input{flex:1;min-width:230px}select{min-width:160px}button{cursor:pointer;background:#1566d1;color:white;border:0}button:disabled{opacity:.4}#status{margin:12px 0;color:#54708f}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid #e0eaf5;border-radius:17px;overflow:hidden;box-shadow:0 6px 22px #173e6510}.preview{height:140px;background:linear-gradient(135deg,#244c7d,#0d2447);display:grid;place-items:center;color:#fff;font-size:44px}.info{padding:15px}.name{font-size:15px;font-weight:bold;overflow-wrap:anywhere;min-height:42px}.meta{font-size:12px;color:#66809e;margin:10px 0}.actions{display:flex;gap:8px}.actions button,.actions a{flex:1;text-align:center;text-decoration:none;background:#e8f1ff;color:#174a8d;padding:10px;border-radius:9px;font-size:13px}.actions button{background:#1264c6;color:white}.pager{display:flex;justify-content:center;align-items:center;gap:15px;margin:22px}.empty{text-align:center;padding:50px;color:#667b95}dialog{border:0;border-radius:17px;max-width:min(900px,94vw);width:100%;padding:20px;box-shadow:0 20px 70px #071a3660}dialog::backdrop{background:#071b34bb}dialog video{width:100%;max-height:70vh;background:#000}dialog .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}dialog .top button{background:#e7edf5;color:#1a385d}footer{font-size:12px;color:#637f9b;text-align:center;margin:24px}
</style></head><body><header><div><h1>RushFinder | آرشیو راش شرکت</h1><small>نمایش خودکار فایل‌های پوشه شبکه</small></div><span>شبکه داخلی</span></header><main><div class="bar"><input id="q" placeholder="جست‌وجوی نام راش..." autocomplete="off"><select id="category"><option value="">همه دسته‌بندی‌ها</option></select><button id="refresh">به‌روزرسانی</button></div><div id="status">در حال بررسی آرشیو...</div><div class="grid" id="grid"></div><div class="pager"><button id="prev">قبلی</button><span id="page"></span><button id="next">بعدی</button></div></main><dialog id="modal"><div class="top"><strong id="modalTitle"></strong><button id="close">بستن ×</button></div><video id="player" controls playsinline preload="metadata"></video><p style="color:#657b93;font-size:13px">بعضی فرمت‌ها مثل MKV و AVI ممکن است در مرورگر پخش نشوند؛ دانلود فایل همچنان امکان‌پذیر است.</p></dialog><footer>RushFinder • فایل‌ها روی سرور شبکه باقی می‌مانند؛ انتقالی به فضای ابری انجام نمی‌شود.</footer><script>
const $=id=>document.getElementById(id);let page=1,pages=1,timer;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fa=n=>Number(n).toLocaleString('fa-IR');const size=n=>n>1073741824?(n/1073741824).toFixed(2)+' GB':(n/1048576).toFixed(1)+' MB';
async function load(){try{const p=new URLSearchParams({q:$('q').value,category:$('category').value,page});const r=await fetch('/api/files?'+p);const d=await r.json();if(!r.ok)throw Error('خطای ارتباط');pages=d.pages;const cat=$('category'),old=cat.value;cat.innerHTML='<option value="">همه دسته‌بندی‌ها</option>'+d.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');cat.value=old;$('status').textContent=d.error?'خطا در خواندن پوشه شبکه: '+d.error:`${fa(d.total)} نتیجه • ${fa(d.all)} فایل در آرشیو • آخرین بررسی: ${new Date(d.lastScan).toLocaleTimeString('fa-IR')}`;$('grid').innerHTML=d.files.length?d.files.map(f=>{const url='/video?id='+encodeURIComponent(f.id);return `<article class="card"><div class="preview">▶</div><div class="info"><div class="name">${esc(f.title)}</div><div class="meta">${esc(f.category)} • ${esc(f.extension)} • ${size(f.size)}</div><div class="actions"><button data-view="${esc(f.id)}" data-title="${esc(f.title)}">نمایش</button><a href="${url}&download=1">دانلود</a></div></div></article>`}).join(''):'<div class="empty">فایلی پیدا نشد. ویدئوها را در پوشه‌های دسته‌بندی شبکه قرار دهید.</div>';$('page').textContent=`صفحه ${fa(page)} از ${fa(pages)}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}catch(e){$('status').textContent='اتصال به سرویس داخلی برقرار نشد: '+e.message}}
$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)};$('category').onchange=()=>{page=1;load()};$('refresh').onclick=async()=>{await fetch('/api/rescan');load()};$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('grid').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;$('modalTitle').textContent=b.dataset.title;$('player').src='/video?id='+encodeURIComponent(b.dataset.view);$('modal').showModal()};function close(){$('player').pause();$('player').removeAttribute('src');$('player').load();$('modal').close()}$('close').onclick=close;$('modal').addEventListener('close',()=>{$('player').pause();$('player').removeAttribute('src');$('player').load()});load();setInterval(load,30000);
</script></body></html>
